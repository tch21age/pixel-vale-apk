name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Generate icons and splash
        run: npx capacitor-assets generate --android

      - name: Patch Android project (landscape, fullscreen)
        run: python3 scripts/patch_android.py

      - name: Sync web assets
        run: npx cap sync android

      - name: Build release APK (unsigned)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Align and sign APK
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          mkdir -p dist
          $BT/zipalign -f -p 4 "$UNSIGNED" dist/aligned.apk
          $BT/apksigner sign --ks signing/pixelvale.jks \
            --ks-pass pass:pixelvale123 --key-pass pass:pixelvale123 \
            --ks-key-alias pixelvale --out dist/pixel-vale-th.apk dist/aligned.apk
          $BT/apksigner verify dist/pixel-vale-th.apk
          rm dist/aligned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pixel-vale-th-apk
          path: dist/pixel-vale-th.apk
          if-no-files-found: error
